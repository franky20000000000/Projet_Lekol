<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Profil Parent</title>
</head>
<body class="bg-gray-50 min-h-screen">
    <!------------------------------------ entete ------------------------------------>
    <header id="navbar" class="fixed flex px-10 justify-between z-50 items-center p-4 shadow-[0_0.5px_6px_rgba(0,0,0,0.1)] w-full text-xl">
        <div>
            <p class="text-[#2B80F6] font-bold text-3xl">Lékol</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-[#2B80F6] flex items-center justify-center text-white font-medium">
                    JP
        </div>
    </header>

    <main class="container mx-auto px-4 pt-[6rem] pb-5">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-2xl font-bold text-gray-800">Mon Compte</h1>
                <button class="px-4 py-2 bg-[#2B80F6] text-white rounded-lg hover:bg-[#1a6ad8] transition">
                    <i class="fas fa-edit mr-2"></i>Modifier
                </button>
            </div>

            <div class="bg-white rounded-xl shadow-lg overflow-hidden mb-8">
                <div class="p-6 border-b border-gray-100">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">Informations Personnelles</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Prénom</label>
                            <p class="text-gray-800">Jean</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Nom</label>
                            <p class="text-gray-800">Paul</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Email</label>
                            <p class="text-gray-800">jean.paul@email.com</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Téléphone</label>
                            <p class="text-gray-800">+237 656 494 937</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Ville</label>
                            <p class="text-gray-800">Douala</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Quartier</label>
                            <p class="text-gray-800">Bonamoussadi</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-lg overflow-hidden mb-8">
                <div class="p-6 border-b border-gray-100">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">Répetiteurs Contactés</h2>
                    <div class="space-y-4">
                        <div class="flex items-center justify-between p-4 border border-gray-200 rounded-lg">
                            <div class="flex items-center space-x-4">
                                <div class="w-12 h-12 rounded-full bg-gray-200 flex items-center justify-center">
                                    <span class="text-gray-600 font-medium">AK</span>
                                </div>
                                <div>
                                    <h3 class="font-medium text-gray-800">Amara Kone</h3>
                                    <p class="text-sm text-gray-600">Mathématiques, Physique - 2500 FCFA/h</p>
                                </div>
                            </div>
                            <span class="px-3 py-1 bg-green-100 text-green-800 text-sm rounded-full">Contacté</span>
                        </div>
                        <div class="flex items-center justify-between p-4 border border-gray-200 rounded-lg">
                            <div class="flex items-center space-x-4">
                                <div class="w-12 h-12 rounded-full bg-gray-200 flex items-center justify-center">
                                    <span class="text-gray-600 font-medium">ND</span>
                                </div>
                                <div>
                                    <h3 class="font-medium text-gray-800">Nadia Diallo</h3>
                                    <p class="text-sm text-gray-600">Français, Anglais - 2000 FCFA/h</p>
                                </div>
                            </div>
                            <span class="px-3 py-1 bg-blue-100 text-blue-800 text-sm rounded-full">En cours</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                <div class="p-6">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">Paramètres du Compte</h2>
                    <div class="space-y-4">
                        <div class="pt-4 border-t border-gray-100">
                            <button class="text-red-600 hover:text-red-800">
                                <i class="fas fa-trash-alt mr-2"></i>Supprimer mon compte
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="Scripts/tailwindcss.js"></script>
    <script src="Scripts/script.js"></script>
</body>
</html>
